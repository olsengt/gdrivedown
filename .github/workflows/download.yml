
name: Download URL to Google Drive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL Download"
        required: true
        type: string

      filename:
        description: "Ten file"
        required: true
        type: string

      folder:
        description: "Thu muc Google Drive"
        default: "Downloads"
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Rclone and Aria2
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Configure Rclone
        env:
          CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$CONFIG" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Test Google Drive
        run: |
          rclone about "gdrive:"

      - name: Download File
        env:
          URL: ${{ inputs.url }}
          FILE: ${{ inputs.filename }}
        run: |
          set -e

          mkdir -p /tmp/downloads
          df -h /tmp/downloads

          aria2c \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=1M \
            --continue=true \
            --max-tries=20 \
            --retry-wait=3 \
            --connect-timeout=30 \
            --timeout=60 \
            --file-allocation=none \
            --summary-interval=2 \
            --console-log-level=notice \
            --download-result=full \
            --auto-file-renaming=false \
            --allow-overwrite=true \
            --dir=/tmp/downloads \
            --out="$FILE" \
            "$URL"

          ls -lh "/tmp/downloads/$FILE"

      - name: Upload to Google Drive
        env:
          FILE: ${{ inputs.filename }}
          FOLDER: ${{ inputs.folder }}
        run: |
          set -e

          rclone mkdir "gdrive:${FOLDER}"

          rclone copyto \
            "/tmp/downloads/${FILE}" \
            "gdrive:${FOLDER}/${FILE}" \
            --stats 2s \
            --stats-one-line \
            --stats-one-line-date \
            --stats-log-level NOTICE \
            --drive-chunk-size 128M \
            --retries 5 \
            --low-level-retries 10 \
            --contimeout 30s \
            --timeout 5m

      - name: Verify File
        env:
          FOLDER: ${{ inputs.folder }}
          FILE: ${{ inputs.filename }}
        run: |
          rclone lsl "gdrive:${FOLDER}/${FILE}"

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/downloads
          rm -f "$HOME/.config/rclone/rclone.conf"
