      - name: Install Aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Download and Upload
        env:
          URL: ${{ inputs.url }}
          FILE: ${{ inputs.filename }}
          FOLDER: ${{ inputs.folder }}
        run: |
          set -e

          mkdir -p /tmp/downloads
          df -h /tmp

          aria2c \
            -x 16 \
            -s 16 \
            -k 1M \
            -c \
            --max-tries=10 \
            --retry-wait=3 \
            --file-allocation=none \
            --summary-interval=2 \
            --console-log-level=notice \
            --download-result=full \
            --dir=/tmp/downloads \
            --out="$FILE" \
            "$URL"

          rclone copyto \
            "/tmp/downloads/$FILE" \
            "gdrive:$FOLDER/$FILE" \
            --drive-chunk-size 128M \
            --stats 2s \
            --stats-one-line \
            --stats-log-level NOTICE \
            --retries 5

          rm -f "/tmp/downloads/$FILE"
