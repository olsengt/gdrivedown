
name: Download URL to Google Drive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL Download"
        required: true
        type: string
      filename:
        description: "Ten file"
        required: true
        type: string
      folder:
        description: "Thu muc Google Drive"
        required: true
        default: "Downloads"
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure Rclone
        env:
          CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$CONFIG" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Test Google Drive
        run: |
          rclone about "gdrive:"

      - name: Download and Upload
        env:
          URL: ${{ inputs.url }}
          FILE: ${{ inputs.filename }}
          FOLDER: ${{ inputs.folder }}
        run: |
          rclone mkdir "gdrive:${FOLDER}"

          rclone copyurl "$URL" "gdrive:${FOLDER}/${FILE}" \
            --progress \
            --stats 2s \
            --stats-one-line \
            --drive-chunk-size 128M \
            --retries 5 \
            --low-level-retries 10 \
            --contimeout 30s \
            --timeout 5m

      - name: Verify File
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          rclone lsl "gdrive:${FOLDER}"

      - name: Cleanup
        if: always()
        run: |
          rm -f "$HOME/.config/rclone/rclone.conf"
